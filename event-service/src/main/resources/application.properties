
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=event-service
server.port=8081

# ==========================================
# DATABASE - POSTGRESQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/event_war
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ipmasqurade0209}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=event_schema

# ==========================================
# KAFKA
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ticket-war-event-booking
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
ticket-war.kafka.war-results-finalized-topic=ticket-war.war-results-finalized.v1

# Ticket offer lifecycle
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:booking-schema.sql
booking.claim-window=PT20M
booking.scheduler-delay-ms=5000

# Local Mailpit SMTP sink; messages are captured locally and not delivered.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
ticket-war.mail.from=no-reply@example.com
ticket-war.frontend-url=http://localhost:5173

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# LOGGING
# ==========================================
logging.level.com.ticketwar.event=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

