
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=event-service
server.port=8081

# ==========================================
# DATABASE - POSTGRESQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/event_war
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:ipmasqurade0209}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=event_schema

# ==========================================
# KAFKA
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# LOGGING
# ==========================================
logging.level.com.ticketwar.event=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

