
# Application
spring.application.name=war-service
server.port=8082

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/event_war
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ipmasqurade0209}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=war_schema
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis cache for read-heavy War Session data
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka producer for finalized War Session results
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.template.default-topic=ticket-war.war-results-finalized.v1

# Jackson
spring.jackson.time-zone=UTC

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# SMTP placeholders for local development. Replace these values with your mail provider.
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=replace-with-smtp-username
spring.mail.password=replace-with-smtp-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
ticket-war.mail.from=no-reply@example.com
ticket-war.frontend-url=http://localhost:5173
