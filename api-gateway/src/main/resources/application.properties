
spring.application.name=api-gateway

server.port=8080

# Gateway routes

# Event Service
spring.cloud.gateway.server.webflux.routes[0].id=event-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/events/**

# War Service
spring.cloud.gateway.server.webflux.routes[1].id=war-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/war/**

# Booking Service
spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/bookings/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
